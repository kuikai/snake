# Codemagic — iOS first (TestFlight)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Before first build:
# 1. Apple Developer Program + App Store Connect app (bundle id below)
# 2. Codemagic → Teams → Integrations → Developer Portal API key (App Manager)
# 3. Replace ASC_KEY_NAME with that integration's exact name
# 4. Replace APP_STORE_APPLE_ID with the numeric App Store Connect app id
# 5. Optional: Team variables RC_IOS_API_KEY for RevenueCat

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ASC_KEY_NAME
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.snake
      vars:
        APP_STORE_APPLE_ID: "0000000000"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: flutter analyze
        ignore_failure: true
      - name: Flutter tests
        script: flutter test
        ignore_failure: true
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0) + 1)) \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=RC_IOS_API_KEY=${RC_IOS_API_KEY:-}
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - mikkeldixen@live.dk
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
