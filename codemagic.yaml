# Codemagic — iOS first (TestFlight)
#
# Env group "snake_ios":
#   APP_STORE_APPLE_ID = App Store Connect → App Information → Apple ID (number)
#   RC_IOS_API_KEY     = optional RevenueCat appl_... key (secure)
#
# Integrations → Developer Portal key name must be exactly: Codemagic

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - snake_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.snake
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Marketing version (what users see). Build number is set in the script.
        APP_VERSION: "1.0.0"
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: flutter analyze
        ignore_failure: true
      - name: Flutter tests
        script: flutter test
        ignore_failure: true
      - name: Build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          # Ask App Store Connect for the highest build already used (any version).
          LATEST=""
          if [ -n "$APP_STORE_APPLE_ID" ] && [ "$APP_STORE_APPLE_ID" != "0000000000" ]; then
            LATEST=$(app-store-connect get-latest-build-number --all-versions "$APP_STORE_APPLE_ID" 2>/dev/null | tr -cd '0-9' || true)
          fi
          if [ -z "$LATEST" ]; then
            LATEST=13
          fi

          # Always clear the known floor (13) and stay ahead of Codemagic counters.
          BUILD_NUMBER=$((LATEST + 1))
          FLOOR=$(( ${PROJECT_BUILD_NUMBER:-0} + 200 ))
          if [ "$FLOOR" -gt "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$FLOOR
          fi

          export FLUTTER_BUILD_NAME="$APP_VERSION"
          export FLUTTER_BUILD_NUMBER="$BUILD_NUMBER"
          echo "APP_STORE_APPLE_ID=$APP_STORE_APPLE_ID"
          echo "Building IPA with version $FLUTTER_BUILD_NAME ($FLUTTER_BUILD_NUMBER)"

          flutter build ipa --release \
            --build-name="$FLUTTER_BUILD_NAME" \
            --build-number="$FLUTTER_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=RC_IOS_API_KEY=${RC_IOS_API_KEY:-}

          # Prove what ended up in the binary before publish.
          APP_PLIST="build/ios/iphoneos/Runner.app/Info.plist"
          if [ -f "$APP_PLIST" ]; then
            echo "Runner.app CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
            echo "Runner.app CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - mikkeldixen@live.dk
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
