# Codemagic — iOS first (TestFlight)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Setup:
# 1. Integrations → Developer Portal → key named exactly "Codemagic"
# 2. Environment variables → group "snake_ios" with:
#      APP_STORE_APPLE_ID = numeric App Store Connect Apple ID (not secure)
#      RC_IOS_API_KEY     = RevenueCat iOS public SDK key appl_... (secure)  [optional]
# 3. App ID + App Store Connect app must exist for com.yourname.snake

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - snake_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.snake
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: flutter analyze
        ignore_failure: true
      - name: Flutter tests
        script: flutter test
        ignore_failure: true
      - name: Build IPA
        script: |
          # App Store Connect already has CFBundleVersion 13+. Always clear that bar.
          # PROJECT_BUILD_NUMBER alone can still be <= 13 early on, so add a floor.
          BUILD_NUMBER=$(( ${PROJECT_BUILD_NUMBER:-0} + 100 ))
          echo "Using CFBundleVersion / build-number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=RC_IOS_API_KEY=${RC_IOS_API_KEY:-}
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - mikkeldixen@live.dk
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
